monitor.alsa.rules = [
  {
    matches = [
      {
        node.nick = "HyperX Virtual Surround Sound"
        alsa.name = "USB Audio"
      }
    ]
    actions = {
      update-props = {
        node.nick = "HyperX Headset"
        device.icon-name = "audio-headphones"
        device.form-factor = "headset"
      }
    }
  }
]
