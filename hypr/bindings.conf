# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, S, Launch Steam, exec, gtk-launch steam

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, Gemini, exec, omarchy-launch-webapp "https://gemini.google.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com"
bindd = SUPER SHIFT ALT, Y, YouTube Music, exec, omarchy-launch-webapp "https://music.youtube.com"
bindd = SUPER SHIFT, W, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com"
bindd = SUPER SHIFT ALT, W, Discord, exec, omarchy-launch-or-focus-webapp Discord "https://discord.com/app"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com"
bindd = SUPER SHIFT, M, Monochrome, exec, omarchy-launch-webapp "https://monochrome.tf"

# change omarchy menu shortcut
unbind = SUPER SHIFT, SPACE
bindd = SUPER SHIFT, SPACE, Omarchy menu, exec, omarchy-menu

# Multi-monitor shortcuts
unbind = SUPER, COMMA
unbind = SUPER, PERIOD
unbind = SUPER SHIFT, COMMA
unbind = SUPER SHIFT, PERIOD
unbind = SUPER CTRL ALT, Delete
bindd = SUPER, COMMA, Focus previous monitor, focusmonitor, -1
bindd = SUPER, PERIOD, Focus next monitor, focusmonitor, +1
bindd = SUPER SHIFT, COMMA, Move window to previous monitor, movewindow, mon:-1
bindd = SUPER SHIFT, PERIOD, Move window to next monitor, movewindow, mon:+1
binddl = SUPER CTRL ALT, Delete, Toggle external display, exec, ~/.local/bin/hyprland-monitor-external-toggle

# Lockscreen overrides
unbind = SUPER CTRL, L
bindd = SUPER CTRL, L, Lock system, exec, ~/.local/bin/omarchy-custom-system-lock

# notification shortcuts
unbind = SUPER CTRL, COMMA
unbind = SUPER CTRL SHIFT, COMMA
bindd = SUPER CTRL, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER CTRL SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all

# Volume step overrides
unbind = , XF86AudioRaiseVolume
unbind = , XF86AudioLowerVolume
bindeld = , XF86AudioRaiseVolume, Volume up, exec, omarchy-swayosd-client --output-volume +2
bindeld = , XF86AudioLowerVolume, Volume down, exec, omarchy-swayosd-client --output-volume -2

# Brightness step overrides
unbind = , XF86MonBrightnessUp
unbind = , XF86MonBrightnessDown
bindeld = , XF86MonBrightnessUp, Brightness up, exec, omarchy-brightness-display +2%
bindeld = , XF86MonBrightnessDown, Brightness down, exec, omarchy-brightness-display 2%-

# External Monitor Brightness step
unbind = ALT, XF86MonBrightnessUp
unbind = ALT, XF86MonBrightnessDown
bindeld = ALT, XF86MonBrightnessUp, External Brightness up, exec, ~/.local/bin/omarchy-brightness-external "+ 5"
bindeld = ALT, XF86MonBrightnessDown, External Brightness down, exec, ~/.local/bin/omarchy-brightness-external "- 5"

# Power shortcuts (only active when hyprlock is running)
binddl = SUPER, ESCAPE, Turn off display, exec, pgrep hyprlock && nohup bash -c "sleep 1 && hyprctl dispatch dpms off" >/dev/null 2>&1
binddl = SUPER, S, Suspend, exec, pgrep hyprlock && systemctl suspend
binddl = SUPER, R, Reboot, exec, pgrep hyprlock && omarchy-system-reboot
binddl = SUPER, P, Shutdown, exec, pgrep hyprlock && omarchy-system-shutdown
