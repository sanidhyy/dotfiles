general {
    lock_cmd = ~/.local/bin/omarchy-custom-system-lock                                   # lock screen and 1password
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true ~/.local/bin/omarchy-custom-system-lock    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && ~/.local/bin/omarchy-custom-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                                                    # wait until screen is locked
}

