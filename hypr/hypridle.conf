# Lock system after 5 minutes (screensaver resets idle timer, so have to just do half + 2s margin)
# listener {
#    timeout = 152
#    on-timeout = omarchy-system-lock
#    on-resume = omarchy-system-wake
# }

# Lock system after 10 minutes
listener {
    timeout = 600
    on-timeout = ~/.local/bin/omarchy-custom-system-lock
    on-resume = ~/.local/bin/omarchy-custom-system-wake
}
