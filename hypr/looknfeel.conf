# Change the default Omarchy look'n'feel

env = XCURSOR_THEME,catppuccin-mocha-dark-cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,catppuccin-mocha-dark-cursors
env = HYPRCURSOR_SIZE,24

# https://wiki.hypr.land/Configuring/Basics/Variables/#general
general {
    # No gaps between windows or borders
    # gaps_in = 0
    # gaps_out = 0
    # border_size = 0

    gaps_in = 4
    gaps_out = 8

    # Change to niri-like side-scrolling layout
    # layout = scrolling
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#group
group {
  groupbar {
    font_family = JetBrainsMono Nerd Font
    font_weight_active = ultrabold
    font_weight_inactive = medium
  }
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#decoration
decoration {
    # Use round window corners
    rounding = 10
    rounding_power = 4.0

    # Dim unfocused windows (0.0 = no dim, 1.0 = fully dimmed)
    dim_inactive = true
    dim_strength = 0.02

    active_opacity = 0.98
    inactive_opacity = 0.94
    fullscreen_opacity = 1

    blur {
        size = 2
        passes = 1
        xray = false
        noise = 0
        contrast = 1
    }

    shadow {
        enabled = true
        range = 16
        scale = 1.0
        render_power = 4
        offset = 0 2
        color = rgba(11111b78)
        color_inactive = rgba(11111b40)
    }
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#animations
animations {
    # Disable all animations
    # enabled = no

    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    bezier = water, 0.22, 0.9, 0.36, 1.0
    bezier = flow, 0.25, 0.1, 0.25, 1.0
    bezier = ripple, 0.33, 0.0, 0.2, 1.0
    bezier = cascade, 0.19, 1.0, 0.22, 1.0
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = bounce, 0.175, 0.885, 0.32, 1.275

    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade,       1, 2.4, water
    animation = fadeIn,     1, 2.0, cascade
    animation = fadeOut,    1, 1.8, ripple
    animation = fadeDim,    1, 2.0, water
    animation = fadeSwitch, 1, 1.4, flow
    animation = layers, 1, 2.4, md3_standard, slidevert
    animation = layersIn, 1, 3, bounce, slidevert 75%
    animation = layersOut, 1, 2.8, md3_standard, slidevert 85%
    animation = workspaces, 1, 5, wind
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#misc
misc {
  animate_manual_resizes = true
  animate_mouse_windowdragging = true
  session_lock_xray = true
  middle_click_paste = false
  mouse_move_enables_dpms = false
  key_press_enables_dpms = false
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#cursor
cursor {
  inactive_timeout = 10
}

# https://wiki.hypr.land/Configuring/Layouts/Scrolling-Layout/
scrolling {
    # See only one column per screen instead of two
    # column_width = 0.97
}

# https://wiki.hypr.land/Configuring/Window-Rules
# Prevent dimming on inactive photos (1), videos (2), and games (3)
windowrule = match:content 1, no_dim on
windowrule = match:content 2, no_dim on
windowrule = match:content 3, no_dim on
windowrule = match:fullscreen true, no_dim on

# VSCode/Cursor hide title bar (Update settings.json)
# {
#   "window.titleBarStyle": "custom",
#   "window.newWindowDimensions": "maximized",
#   "window.restoreFullscreen": true
# }
windowrule = match:class code, fullscreen_state 0 3
windowrule = match:class cursor, fullscreen_state 0 3
windowrule = match:class codium, fullscreen_state 0 3

# https://wiki.hypr.land/Configuring/Basics/Window-Rules/#layer-rules
# Reduce layer animation
layerrule = animation fade, match:class hyprpicker
layerrule = animation fade, match:class mpvpaper
layerrule = animation fade, match:class swaybg

# Packettracer window rules
windowrule = float on, match:class ^(PacketTracer)$
windowrule = no_anim on, match:class ^(PacketTracer)$
windowrule = no_blur on, match:class ^(PacketTracer)$
windowrule = no_dim on, match:class ^(PacketTracer)$
windowrule = no_shadow on, match:class ^(PacketTracer)$
windowrule = opaque on, match:class ^(PacketTracer)$
windowrule = immediate on, match:class ^(PacketTracer)$
windowrule = border_size 0, match:class ^(PacketTracer)$
windowrule = rounding 0, match:class ^(PacketTracer)$
windowrule = decorate off, match:class ^(PacketTracer)$
windowrule = nearest_neighbor on, match:class ^(PacketTracer)$
windowrule = xray on, match:class ^(PacketTracer)$
windowrule = min_size 1 1, match:class ^(PacketTracer)$
windowrule = keep_aspect_ratio on, match:title ^(Cisco Packet Tracer)$, match:class ^(PacketTracer)$
windowrule = focus_on_activate on, match:title ^(Cisco Packet Tracer)$, match:class ^(PacketTracer)$
windowrule = min_size 486 628, match:title ^(Preference)$, match:class ^(PacketTracer)$
windowrule = min_size 486 628, match:title ^(.*outer.*)$, match:class ^(PacketTracer)$
windowrule = min_size 772 700, match:title ^(.*witch.*)$, match:class ^(PacketTracer)$
windowrule = min_size 807 655, match:title ^(.*PC.*)$, match:class ^(PacketTracer)$
windowrule = min_size 791 648, match:title ^(.*Save File.*)$, match:class ^(PacketTracer)$

